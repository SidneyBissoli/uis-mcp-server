name: mcpscore (contrato de qualidade)

# O QUE ISTO GUARDA, e por que é contrato e não métrica.
#
# `mcpscore` é auditor determinístico (sem juiz LLM): conecta como cliente MCP
# real e verifica conformidade de protocolo, qualidade das tools, segurança/auth
# e prontidão para a spec 2026-07-28. É o ÚNICO dos quatro agregadores que mede
# o SERVIDOR RODANDO — mcpindex, Glama e LobeHub leem ficha e repositório.
# Por isso aqui ele deixa de ser número no painel e vira gate.
#
# CATRACA, não meta. O piso é o valor MEDIDO, arredondado para baixo: impede
# regressão sem prometer melhora. Ao subir a nota de verdade, suba o piso na
# mesma passada — senão a catraca protege um patamar que o servidor já não tem.
#
# HISTÓRICO DO PISO
#  - 30/08/2026: fechados websiteUrl e ícone no handshake e a recusa de cursor
#    inválido → 122/125. No mesmo dia caíram os dois que restavam:
#    `server/discover` (src/discover.ts) e o `-32602` para recurso inexistente,
#    que era sintoma de não haver superfície de resources — resolvido criando-a
#    (src/resources.ts), não fingindo o código de erro.
#
#    O DENOMINADOR MUDOU JUNTO, e é a parte que engana: registrar resources
#    tirou 27 regras da lista de puladas, então o total foi de 125 para 152.
#    Comparar 122/125 com 152/152 como se fosse a mesma prova seria erro — a
#    segunda cobre superfície que a primeira nem media. Produção: 152/152.
#
# UM PISO DE 100 É DESCONFORTÁVEL DE PROPÓSITO. Ele fica vermelho tanto numa
# regressão nossa quanto numa REGRA NOVA do auditor que ainda não atendemos — e
# a segunda também é notícia, não ruído: é uma exigência de conformidade que
# passou a existir. Quem baixar este piso está decidindo não saber.
#
# DOIS JOBS, como no irmão ilo-mcp-server. O gate do PR mede o CÓDIGO DO PR
# pelo stdio (`dist/cli.js`, o mesmo `buildServer` do Worker); o pós-deploy
# mede o que FOI AO AR. São perguntas diferentes.
#
# Até 08/10/2026 havia um job só, e este cabeçalho dizia que aqui não existia
# stdio. Era verdade em 30/08/2026 e deixou de ser na 0.4.0, quando entraram
# `src/cli.ts`, o `bin` e a publicação no npm — o texto ficou e a premissa
# vencida manteve o PR sem gate. Auditar `wrangler dev` continua errado (sem
# `CF-Connecting-IP` todas as requisições caem no mesmo balde do rate limit:
# medido em 30/08/2026, 8 de 46 voltaram 429 e o auditor leu como três regras
# de segurança reprovadas); o stdio não tem esse problema, porque não passa
# pela borda.
#
# PISO DO STDIO: 87. Medido em 08/10/2026 (mcpscore local, mesmo dia e mesma
# versão do auditor no ilo): uis 116/133 = 87,2%, ilo 136/153 = 88,9%. Nenhuma
# regra reprovada em nenhum dos dois, e as regras comuns têm o mesmo resultado:
# os 17 pontos que faltam são os MESMOS nos dois (prontidão para a spec
# 2026-07-28, 13/30). O uis fica abaixo só porque não serve prompts e o
# denominador é menor — o mesmo efeito do histórico acima, ao contrário.
#
# O JOB REMOTO ESPERA O TÉRMINO DO DEPLOY, não o push. Ele mede o ENDPOINT, e o
# deploy-worker.yml roda no mesmo push — em paralelo, sem ordem garantida.
# Disparar pelo push faria a auditoria medir o código anterior e reprovar por
# causa do relógio, não do servidor. Foi exatamente a armadilha corrigida no
# ilo-mcp-server em 30/08/2026, e ela chega aqui já resolvida.
#
# Ruído aceito: enquanto os secrets da Cloudflare não estiverem cadastrados, o
# deploy se pula sozinho mas conclui com sucesso, e esta auditoria roda assim
# mesmo — medindo uma produção que não mudou. Passa, e não custa nada além de
# meio minuto de runner.

on:
  pull_request:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Deploy to Cloudflare Workers"]
    types: [completed]
  # Semanal, porque o gatilho do deploy sozinho deixa um buraco: o
  # `deploy-worker.yml` é filtrado por caminho, então semana inteira sem tocar
  # em `src/` não audita nada. E o auditor não é estático — REGRA NOVA dele
  # também reprova, e isso é notícia, não ruído (é a razão de o piso ser 100).
  # Sem esta linha, uma regra nova só apareceria no deploy seguinte, que pode
  # demorar. Os seis repositórios rodam em horas diferentes, de propósito: uma
  # falha de infraestrutura da Cloudflare não deve chegar como seis alarmes
  # simultâneos parecendo seis defeitos.
  schedule:
    - cron: "17 10 * * 1"
  workflow_dispatch:

jobs:
  stdio:
    name: contrato no código do PR (stdio)
    # O eco do deploy não traz código novo — o PR e o push já mediram este
    # commit. O semanal entra: o que muda sem commit é a versão do auditor (o
    # `uvx` não pina) e a árvore de dependências.
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Build (o auditor precisa do bundle, não do fonte)
        run: npm run build
      - uses: astral-sh/setup-uv@v7
      - name: Auditar o servidor local
        run: uvx mcpscore --fail-under 87 --stdio node dist/cli.js

  remoto:
    name: contrato no que está no ar (streamable http)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Auditar o endpoint em produção
        run: uvx mcpscore --fail-under 100 https://uis.sidneybissoli.com/mcp
