name: CI

# O gate de código deste repositório. Até 30/08/2026 não existia: o único
# workflow era o publish.yml, que roda em release, e os testes só apareciam lá —
# PR nenhum era testado. O deploy-worker.yml passou a rodar a suíte, mas só em
# push para main e só nos caminhos do Worker; este arquivo é o que cobre o PR.
#
# Dois canais, duas garantias. O Worker é transpilado pelo próprio wrangler na
# hora do deploy: o dry-run monta o bundle de verdade e pega o que o tsc não
# pega — import que resolve em tipo mas não resolve no bundler (foi a classe de
# risco de mexer na árvore do SDK em 30/08/2026). O runtime stdio (src/cli.ts,
# desde a 0.4.0) é o que vai para o npm: `npm run build` gera o dist/ e o dump
# da superfície fala JSON-RPC com ele por subprocesso, offline — como no irmão
# ilo-mcp-server.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Matriz nas DUAS linhas de LTS vivas, não só na de baixo: até 31/08/2026
    # este job rodava só em 22 e o `engines.node` do pacote era promessa que
    # nenhum job exercitava — foi assim que o `>=18` do sih-br-mcp sobreviveu
    # sem ninguém notar.
    strategy:
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # A superfície publicada é o produto: initialize + tools/list +
      # resources/list + prompts/list sobre o build, offline.
      - name: Dump da superfície (fumaça do runtime stdio)
        run: node scripts/dump-surface.mjs --stdio > /dev/null
      # Sem credencial: --dry-run só monta o bundle e sai, não fala com a
      # Cloudflare. Se o Worker não empacota, o PR fica vermelho aqui e não em
      # produção.
      - name: O Worker empacota (wrangler dry-run)
        run: npx wrangler deploy --dry-run --outdir /tmp/wrangler-dry
